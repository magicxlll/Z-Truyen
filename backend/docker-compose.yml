services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ztruyen-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - ZTRUYEN_DATA_DIR=/app/data
      - FAST_SCRAPE_CONCURRENCY=5
      - ENABLE_PLAYWRIGHT_FALLBACK=true
      - AKAY_USERNAME=${AKAY_USERNAME:-}
      - AKAY_PASSWORD=${AKAY_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional Cloudflare Tunnel for secure remote HTTPS access on Xteink X3
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ztruyen-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - tunnel
