[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ztruyen-backend"
version = "1.0.0"
description = "Z-Truyen X3 Vietnamese Story Backend & OPDS Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "EbookLib>=0.18",
    "Pillow>=10.2.0",
    "playwright>=1.42.0",
    "python-multipart>=0.0.9",
    "zeroconf>=0.140.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
